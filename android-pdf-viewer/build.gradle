apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

ext {
    bintrayRepo = 'maven'
    bintrayName = 'pdfreader'

    publishedGroupId = 'com.github.abswerit'
    libraryName = 'pdfreader'
    artifact = 'pdfreader'

    libraryDescription = 'Android view for displaying PDFs rendered with PdfiumAndroid, maintained by Abswer.com'

    siteUrl = 'https://abswer.com'
    gitUrl = 'https://github.com/abswerit/pdfreader.git'

    libraryVersion = '1.1.0'

    developerId = 'abswerit'
    developerName = 'Abswer'
    developerEmail = 'contact@abswer.com'

    licenseName = 'The Apache Software License, Version 2.0'
    licenseUrl = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
    allLicenses = ["Apache-2.0"]
}

android {
    namespace 'com.github.barteksc.pdfviewer'
    compileSdkVersion 37

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 37
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Configure packaging for 16 KB page size compatibility.
    // Native libraries should be stored uncompressed and page-aligned in the APK.
    packagingOptions {
        jniLibs {
            // Setting to false ensures native libraries are stored uncompressed and aligned.
            // This is the default for AGP 3.6+ but explicitly set for clarity.
            useLegacyPackaging false
        }
    }

    // Enable 16 KB page size support for native libraries
    ndkVersion "30.0.16248370"

    // Disable lint for now to focus on 16 KB compatibility
    lint {
        abortOnError false
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    api 'io.github.oothp:pdfium-android:1.9.5-beta01'
}

// Configure Maven publishing for JitPack
group = project.findProperty("group") ?: "com.github.abswerit"
version = project.findProperty("version") ?: "1.1.0"

// sources jar is produced via android.publishing.singleVariant.withSourcesJar()

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = "pdfreader"
                version = project.version as String
                pom {
                    name = "pdfreader"
                    description = "Android view for displaying PDFs rendered with PdfiumAndroid, maintained by Abswer.com"
                    url = "https://abswer.com"
                    developers {
                        developer {
                            id = "abswerit"
                            name = "Abswer"
                            email = "contact@abswer.com"
                            url = "https://abswer.com"
                        }
                    }
                    licenses {
                        license {
                            name = "The Apache Software License, Version 2.0"
                            url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                        }
                    }
                    scm {
                        url = "https://github.com/abswerit/pdfreader"
                        connection = "scm:git:git://github.com/abswerit/pdfreader.git"
                        developerConnection = "scm:git:ssh://github.com:abswerit/pdfreader.git"
                    }
                }
            }
        }
    }
}
